#pdead{font-weight:700;font-size:3rem;letter-spacing:.1em;line-height:1}
#pname{font-weight:900;font-size:4.4rem;line-height:1;margin-top:1rem}
#pbounty{font-weight:900;font-size:4.2rem;line-height:1;margin-top:1rem}
#pmarine{font-weight:700;font-size:1.6rem;letter-spacing:.4em;text-align:right;margin-top:1rem}
#section{left:4%;margin-left:50rem;right:4%;top:16rem}
#kicker{font-size:2.4rem;letter-spacing:.3em;color:#ffd23f;text-shadow:0 2px 0 #3a1408}
#title{font-family:'Pirata One',cursive;font-weight:400;font-size:15rem;line-height:.9;color:#ffd23f;margin-top:1.4rem;
 -webkit-text-stroke:.5rem #3a1408;text-shadow:0 .9rem 0 #c8102e,0 1.6rem 2.4rem rgba(0,0,0,.5)}
#subtitle{font-size:3.4rem;letter-spacing:.18em;text-shadow:0 3px 0 #3a1408;margin-top:1.4rem}
#tipbox{max-width:640px;margin-top:2.6rem;padding:2.2rem 2.6rem 2.2rem 3rem;color:#3a2010;border-radius:3px;
 background:-webkit-linear-gradient(top,#f1dcab,#ddbd80);background:linear-gradient(180deg,#f1dcab,#ddbd80);box-shadow:0 1.2rem 2.4rem rgba(0,0,0,.45)}
#tiplabel{font-size:1.9rem;letter-spacing:.24em;color:#c8102e;margin-bottom:.8rem}
#tip{font-style:italic;font-size:2.6rem;line-height:1.35}
.tipin{-webkit-animation:tipin .6s ease both;animation:tipin .6s ease both}
#links{margin-top:2.6rem;white-space:nowrap}
#discord{display:inline-block;font-size:2.6rem;letter-spacing:.14em;padding:1.2rem 2.6rem;background:#c8102e;color:#fff4dc;
 border:3px solid #3a1408;border-radius:6px;box-shadow:0 .6rem 0 #3a1408;text-decoration:none}
#servername{display:inline-block;margin-left:2rem;font-size:2rem;letter-spacing:.12em;opacity:.9}
#footer{left:4%;right:4%;bottom:3.6rem;height:20rem}
#status{position:absolute;left:0;top:0;font-size:2.4rem;letter-spacing:.16em;color:#ffd23f;text-shadow:0 2px 0 #3a1408}
#fileline{position:absolute;left:0;top:3.4rem;width:60%;font-size:1.8rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#percent{position:absolute;right:0;top:0;font-size:7rem;line-height:.9;text-shadow:0 .5rem 0 #c8102e,0 .9rem 0 #3a1408}
#bar{position:absolute;left:0;right:0;top:15rem;height:1.4rem;border-radius:1rem;border:2px solid #3a1408;box-shadow:0 .4rem 0 rgba(0,0,0,.4);
 background:-webkit-repeating-linear-gradient(-25deg,#8a5a2b 0,#8a5a2b 8px,#6b4320 8px,#6b4320 16px);
 background:repeating-linear-gradient(115deg,#8a5a2b 0,#8a5a2b 8px,#6b4320 8px,#6b4320 16px)}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:1rem;-webkit-transition:width .45s ease;transition:width .45s ease;
 background:-webkit-repeating-linear-gradient(-25deg,#ffd23f 0,#ffd23f 8px,#f0b72a 8px,#f0b72a 16px);
 background:repeating-linear-gradient(115deg,#ffd23f 0,#ffd23f 8px,#f0b72a 8px,#f0b72a 16px)}
.stop{position:absolute;top:50%;width:1.8rem;height:1.8rem;margin:-.9rem 0 0 -.9rem;border-radius:50%;border:2px solid #3a1408;background:#6b4320}

<div id="footer" class="abs">
 <div id="status" class="bang">ON L&Egrave;VE L'ANCRE !</div>
 <div id="fileline">Chargement de la cargaison&hellip;</div>
 <div id="percent" class="bang">0%</div>
 <div id="bar"><div id="fill"></div><div id="boat"></div></div>
</div>

<script>
(function () {
  // 1rem = 1 % de la hauteur de l'écran
  function fit() { document.documentElement.style.fontSize = (window.innerHeight / 100) + 'px'; }
  fit(); window.onresize = fit;

  var $ = function (id) { return document.getElementById(id); };
  function text(id, s) { var e = $(id); if (e) { e.textContent = s; } }

  var tips = [
    "Un pirate ne d\u00e9gaine pas sans raison : le RP prime toujours sur le combat.",
    "Ta prime se gagne en mer, pas en /me. Trouve un \u00e9quipage !",
    "Navigateur, cuisinier, m\u00e9decin\u2026 chaque r\u00f4le compte autant qu'un sabreur.",
    "Un fruit du d\u00e9mon se m\u00e9rite en RP \u2014 et la mer ne te le pardonnera jamais.",
    "Le powergaming coule le navire de tout le monde. Laisse les autres r\u00e9pondre.",
    "\u00c9cris ta fiche perso avant d'embarquer \u2014 le staff la lit vraiment."
  ];
  var islands = ["Syrup", "Loguetown", "Little Garden", "Shark Park", "Kozuki"];
  var st = { total: 0, needed: 0, file: "", status: "On l\u00e8ve l'ancre !", demo: 0, tip: 0 };

  // Îles le long de la barre
  var bar = $('bar'), stops = [];
  for (var i = 0; i < islands.length; i++) {
    var at = i / (islands.length - 1) * 100;
    var d = document.createElement('div'); d.className = 'stop'; d.style.left = at + '%'; bar.appendChild(d);
    var n = document.createElement('div'); n.className = 'stopname bang'; n.style.left = at + '%'; n.textContent = islands[i]; bar.appendChild(n);
    stops.push({ el: d, at: at });
  }

  function commas(n) { var s = String(Math.round(n)); return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function render() {
    var pct = st.total > 0 ? Math.max(0, Math.min(100, (st.total - st.needed) / st.total * 100)) : st.demo;
    var done = st.total - st.needed;
    var line = st.file ? (st.total > 0 ? done + ' / ' + st.total + ' \u2014 ' + st.file : st.file)
      : (st.total > 0 ? done + ' / ' + st.total + ' fichiers' : 'Chargement de la cargaison\u2026');
    text('status', (st.status || 'Chargement').toUpperCase());
    text('fileline', line);
    text('percent', Math.round(pct) + '%');
    $('fill').style.width = pct + '%';
    $('boat').style.left = pct + '%';
    text('bounty', commas(Math.round(pct / 100 * 3000000000 / 1000) * 1000));
    for (var i = 0; i < stops.length; i++) { stops[i].el.style.background = pct >= stops[i].at ? '#ffd23f' : '#6b4320'; }
  }

  function showTip() {
    var e = $('tip'); e.className = ''; void e.offsetWidth; e.className = 'tipin';
    e.textContent = '\u00ab ' + tips[st.tip] + ' \u00bb';
  }

  // Appels de Garry's Mod pendant la connexion
  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid) {
    if (servername) text('servername', servername);
    if (mapname) text('map', mapname);
    if (maxplayers != null) text('places', String(maxplayers));
  };
  window.SetFilesTotal = function (t) { st.total = Number(t) || 0; render(); };
  window.SetFilesNeeded = function (n) { st.needed = Number(n) || 0; render(); };
  window.DownloadingFile = function (f) { st.file = String(f || ''); render(); };
  window.SetStatusChanged = function (s) { st.status = String(s || ''); render(); };

  // Paramètres de l'adresse (?servername=...&mapname=...)
  var q = location.search.replace(/^\?/, '').split('&');
  for (var k = 0; k < q.length; k++) {
    var kv = q[k].split('='); if (kv.length < 2) continue;
    var v = decodeURIComponent(kv[1].replace(/\+/g, ' '));
    if (kv[0] === 'servername') text('servername', v);
    if (kv[0] === 'mapname') text('map', v);
    if (kv[0] === 'maxplayers') text('places', v);
  }

  setInterval(function () { st.tip = (st.tip + 1) % tips.length; showTip(); }, 7000);
  // Progression de démonstration tant que GMod n'envoie pas de vrais chiffres
  setInterval(function () { if (st.total > 0) return; st.demo = st.demo >= 100 ? 0 : Math.min(100, st.demo + Math.random() * 3); render(); }, 300);

  showTip(); render();
})();
</script>
